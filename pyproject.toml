[project]
name = "mnist-ocr"
version = "1.0.0"
description = "Hands-on MNIST digit recognition project"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch==2.14.0",
    "torchvision==0.29.0",
    "Pillow==12.3.0",
]

[dependency-groups]
dev = ["uv==0.13.5", "ruff", "pyrefly"]
notebooks = ["ipykernel==7.3.0","numpy==2.5.3","pandas==3.0.5","matplotlib==3.11.2"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["notebooks", "data", "results", "node_modules"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyrefly]
project-includes = ["src/**/*.py", "tests/**/*.py"]
search-path = ["."]
python-version = "3.13"
python-interpreter-path = ".venv/bin/python"
check-unannotated-defs = true
